services:
  ans-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace
      - ./config:/app/config:ro
      - ./data:/app/data
    working_dir: /app
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
